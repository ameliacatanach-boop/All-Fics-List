// Bottom sheet shell. Rendered into <body> so it floats above the list.
function Sheet({ label, onClose, children }) {
  const ref = useRef(null);
  useEffect(() => {
    const prev = document.activeElement;
    if (ref.current) ref.current.focus();
    return () => { if (prev && prev.focus) prev.focus(); };
  }, []);
  return ReactDOM.createPortal(
    <div className="scrim" onClick={onClose}>
      <section role="dialog" aria-modal="true" aria-label={label} className="sheet" tabIndex={-1} ref={ref}
        onClick={e => e.stopPropagation()} onKeyDown={e => { if (e.key === 'Escape' && onClose) onClose(); }}>
        <div className="handle" aria-hidden="true"></div>
        {children}
      </section>
    </div>,
    document.body
  );
}

function StatusPill({ status, dnr }) {
  if (status === STATUS_UNREAD) return null;
  const reason = (status === STATUS_DNF || status === STATUS_NOTINT) && dnr ? DNR_LABELS[dnr] : '';
  let pill;
  if (status === STATUS_DNF) pill = <span className="pill" style={{ background: 'var(--inverse)', color: 'var(--on-inverse)' }}>DNF</span>;
  else if (status === STATUS_NOTINT) pill = <span className="pill" style={{ background: 'var(--text-secondary)', color: 'var(--surface)' }}>Not interested</span>;
  else if (status === STATUS_READ) pill = <span className="pill" style={{ background: 'var(--lime)', color: '#111111' }}><Check size={11} />Read</span>;
  else if (status === STATUS_READING) pill = <span className="pill" style={{ background: 'var(--blue)', color: '#FFFFFF' }}>Reading</span>;
  else if (status === STATUS_PAUSED) pill = <span className="pill" style={{ background: 'var(--grey-block)', color: 'var(--on-grey)' }}><PauseIcon size={10} />Paused</span>;
  else if (status === STATUS_TBR) pill = <span className="pill" style={{ background: 'var(--pink)', color: '#111111' }}>TBR</span>;
  else pill = <span className="pill" style={{ background: 'var(--grey-block)', color: 'var(--on-grey)' }}>{STATUS_LABELS[status]}</span>;
  return (<>{pill}{reason && <span className="t-meta" style={{ fontWeight: 700 }}>{reason}</span>}</>);
}

function Chip({ active, onClick, children, color, textColor }) {
  return (
    <button onClick={onClick} aria-pressed={!!active} className="chip"
      style={active ? { background: color || 'var(--inverse)', color: textColor || 'var(--on-inverse)' } : undefined}>
      {active && <Check size={14} />}{children}
    </button>
  );
}

// panelOnly + initialPending let the Currently-reading shelf open the very same Read / DNF
// flows (rating, kudos, bookmark, Content picker) without the status chips around them.
function StatusPicker({ ficId, status, dnr, dnrTags, dnrShips, dnrCategory, enjoyment, kg, bk, tags, ships, category, onUpdate, reading, canAddDateRead, initialPending, panelOnly, onDone, onCancel, title, authors }) {
  const { multi } = useContext(FandomCtx);
  const shipList = multi ? (ships || []) : [];
  const [pendingStatus, setPendingStatus] = useState(initialPending ?? null);
  const [addingDate, setAddingDate] = useState(false);
  const [dateVal, setDateVal] = useState('');
  const [pendingDnrCode, setPendingDnrCode] = useState(null);
  const [pickedDnrTags, setPickedDnrTags] = useState([]);
  const [pickedDnrShips, setPickedDnrShips] = useState([]);
  const [pickedDnrCategory, setPickedDnrCategory] = useState(false);
  const [pendingRating, setPendingRating] = useState(initialPending === STATUS_READ ? (enjoyment || 0) : 0);

  const setStatus = (s) => {
    setPendingDnrCode(null);
    if (s === STATUS_READ) { setPendingRating(enjoyment || 0); setPendingStatus(STATUS_READ); }
    else if (s === STATUS_DNF || s === STATUS_NOTINT) setPendingStatus(s);
    else {
      const keepEnjoyment = s === STATUS_READING || s === STATUS_PAUSED;
      onUpdate(ficId, { status: s, dnr: 0, dnrTags: [], dnrShips: [], dnrCategory: false, ...(keepEnjoyment ? {} : { enjoyment: 0 }) });
      setPendingStatus(null);
    }
  };
  const toggleRating = (n) => setPendingRating(prev => prev === n ? 0 : n);
  const confirmRead = (kgVal, bkVal) => { onUpdate(ficId, { status: STATUS_READ, kg: kgVal, bk: bkVal, enjoyment: pendingRating }); setPendingStatus(null); onDone && onDone(); };
  const confirmDnr = (reasonCode) => {
    if (reasonCode === DNR_CONTENT) {
      setPendingDnrCode(reasonCode);
      setPickedDnrTags(dnrTags && dnrTags.length ? dnrTags : []);
      setPickedDnrShips(multi && dnrShips && dnrShips.length ? dnrShips : []);
      setPickedDnrCategory(!!dnrCategory);
    } else {
      onUpdate(ficId, { status: pendingStatus, dnr: reasonCode, dnrTags: [], dnrShips: [], dnrCategory: false });
      setPendingStatus(null);
      onDone && onDone();
    }
  };
  const toggleDnrTag = (t) => setPickedDnrTags(prev => prev.includes(t) ? prev.filter(x => x !== t) : [...prev, t]);
  const toggleDnrShip = (sh) => setPickedDnrShips(prev => prev.includes(sh) ? prev.filter(x => x !== sh) : [...prev, sh]);
  const anyPicked = pickedDnrTags.length > 0 || pickedDnrShips.length > 0 || pickedDnrCategory;
  const confirmDnrContent = () => {
    onUpdate(ficId, { status: pendingStatus, dnr: DNR_CONTENT, dnrTags: pickedDnrTags, dnrShips: pickedDnrShips, dnrCategory: pickedDnrCategory });
    setPendingStatus(null); setPendingDnrCode(null); setPickedDnrTags([]); setPickedDnrShips([]); setPickedDnrCategory(false);
    onDone && onDone();
  };

  // UI glue: closes the sheet without saving (same as the old inline panel's Cancel).
  const closeSheet = () => { if (panelOnly) { onCancel && onCancel(); } else { setPendingStatus(null); setPendingDnrCode(null); } };
  const byLine = authors && authors.length ? authors.join(', ') : '';
  const reasonStyle = (code) => (pendingDnrCode === code
    ? { background: 'var(--coral)', color: '#111111', fontWeight: 800 }
    : { background: 'var(--surface-sunken)', color: 'var(--text)' });
  const kbStyle = { Neither: { background: 'var(--surface-sunken)', color: 'var(--text)' }, Kudos: { background: 'var(--pink)', color: '#111111' },
    Bookmarked: { background: 'var(--lime)', color: '#111111' }, Both: { background: 'var(--inverse)', color: 'var(--on-inverse)' } };

  return (
    <div>
      {!panelOnly && (
        <div className="panel stack" style={{ gap: 10, marginTop: 4 }}>
          <div className="t-label">Status</div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, minmax(0, 1fr))', gap: 8 }}>
            {[STATUS_UNREAD, STATUS_TBR, STATUS_READING, STATUS_PAUSED, STATUS_READ, STATUS_DNF, STATUS_SKIPPED, STATUS_NOTINT].map(s => {
              const on = status === s;
              return (
                <button key={s} onClick={() => setStatus(s)} aria-pressed={on} className="btn"
                  style={on ? { background: 'var(--inverse)', color: 'var(--on-inverse)' } : { background: 'var(--surface)', color: 'var(--text)' }}>
                  {on ? <Check size={14} /> : <span className="dot" style={{ background: STATUS_DOT[s] }} aria-hidden="true"></span>}
                  {STATUS_LABELS[s]}
                </button>
              );
            })}
          </div>
          {status !== STATUS_UNREAD && pendingStatus === null && (
            <p className="t-caption" style={{ margin: 0 }}>
              {status === STATUS_READ && `Kudos: ${kg ? 'Yes' : 'No'} · Bookmarked: ${bk ? 'Yes' : 'No'}${enjoyment ? ` · Enjoyment: ${enjoyment}/5` : ''}`}
              {(status === STATUS_DNF || status === STATUS_NOTINT) && dnr > 0 && (() => {
                if (dnr === DNR_CONTENT) {
                  const parts = [];
                  if (dnrTags && dnrTags.length) parts.push(`Tags: ${dnrTags.join(', ')}`);
                  if (multi && dnrShips && dnrShips.length) parts.push(`Ships: ${dnrShips.join(', ')}`);
                  if (dnrCategory) parts.push('Category');
                  return `Reason: Content${parts.length ? ` (${parts.join('; ')})` : ''}`;
                }
                if (dnr === DNR_LEGACY_CONTENT_TAGS) return `Reason: ${DNR_LABELS[dnr]}${dnrTags && dnrTags.length ? ` (${dnrTags.join(', ')})` : ''}`;
                return `Reason: ${DNR_LABELS[dnr]}`;
              })()}
            </p>
          )}
          {pendingStatus === null && readingDatesLine(status, reading || {}) && (
            <p className="t-caption" style={{ margin: 0 }}>{readingDatesLine(status, reading || {})}</p>
          )}
          {pendingStatus === null && status === STATUS_READ && !(reading && reading.dateRead) && canAddDateRead && (
            addingDate ? (
              <div className="row" style={{ gap: 8, flexWrap: 'wrap' }}>
                <input type="date" value={dateVal} max={melbourneNow().date} onChange={e => setDateVal(e.target.value)} aria-label="Date read"
                  style={{ minHeight: 44, border: 0, borderRadius: 999, padding: '0 14px', background: 'var(--surface)', color: 'var(--text)', fontSize: 14, fontWeight: 600 }} />
                <button disabled={!/^\d{4}-\d{2}-\d{2}$/.test(dateVal)}
                  onClick={() => { onUpdate(ficId, { dateRead: dateVal }); setAddingDate(false); setDateVal(''); }}
                  className="btn btn-primary">Save</button>
                <button onClick={() => { setAddingDate(false); setDateVal(''); }} className="btn btn-text">Cancel</button>
              </div>
            ) : (
              <div><button onClick={() => setAddingDate(true)} className="link">Add date read</button></div>
            )
          )}
        </div>
      )}

      {pendingStatus !== null && (
        <Sheet label={pendingStatus === STATUS_READ ? 'Mark as read' : 'Why are you marking this?'} onClose={closeSheet}>
          <div>
            <div className="t-meta" style={{ fontWeight: 700 }}>
              {pendingStatus === STATUS_READ ? 'Finished' : pendingStatus === STATUS_DNF ? 'Marking DNF' : 'Marking Not interested'}{byLine ? ` · ${byLine}` : ''}
            </div>
            <h2 className="t-sheet" style={{ marginTop: 2 }}>{pendingStatus === STATUS_READ ? <span className="hl">{title}</span> : title}</h2>
          </div>

          {pendingStatus === STATUS_READ && (
            <>
              <div className="stack" style={{ gap: 8 }}>
                <div className="row" style={{ fontSize: 15, fontWeight: 800 }}><span className="step">1</span>How much did you enjoy it?&nbsp;<span className="t-meta">Optional</span></div>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5, minmax(0, 1fr))', gap: 6 }}>
                  {[1, 2, 3, 4, 5].map(n => (
                    <button key={n} onClick={() => toggleRating(n)} aria-label={`Enjoyment ${n} of 5`} aria-pressed={pendingRating === n} className="tile num">{n}</button>
                  ))}
                </div>
                <div className="row t-caption" style={{ justifyContent: 'space-between' }}>
                  <span>1 · didn't enjoy it</span><span>3 · neutral</span><span>5 · loved it</span>
                </div>
              </div>
              <div className="stack" style={{ gap: 8 }}>
                <div className="row" style={{ fontSize: 15, fontWeight: 800 }}><span className="step">2</span>Left kudos? Bookmarked?&nbsp;<span className="t-meta">Tap to save</span></div>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, minmax(0, 1fr))', gap: 8 }}>
                  {[[false, false, 'Neither'], [true, false, 'Kudos'], [false, true, 'Bookmarked'], [true, true, 'Both']].map(([kv, bv, label]) => (
                    <button key={label} onClick={() => confirmRead(kv, bv)} className="btn btn-lg" style={kbStyle[label]}>{label}</button>
                  ))}
                </div>
              </div>
            </>
          )}

          {(pendingStatus === STATUS_DNF || pendingStatus === STATUS_NOTINT) && (
            <>
              <div className="stack" style={{ gap: 8 }}>
                <div style={{ fontSize: 15, fontWeight: 800 }}>Why?</div>
                <div className="row" style={{ gap: 8 }}>
                  {[DNR_WRITING, DNR_CONTENT, DNR_OTHER].map(code => (
                    <button key={code} onClick={() => confirmDnr(code)} aria-pressed={pendingDnrCode === code} className="btn grow"
                      style={{ minHeight: 48, padding: '0 8px', ...reasonStyle(code) }}>
                      {pendingDnrCode === code && <Check size={14} />}{DNR_LABELS[code]}
                    </button>
                  ))}
                </div>
              </div>
              {pendingDnrCode === DNR_CONTENT && (
                <div className="panel stack" style={{ gap: 10 }}>
                  <div style={{ fontSize: 14, fontWeight: 800 }}>What was the issue? <span className="t-meta">{multi ? 'Pick any mix of tags, ships or category' : 'Pick any mix of tags or category'}</span></div>
                  {tags.length > 0 && (
                    <div className="stack" style={{ gap: 6 }}>
                      <div className="t-caps">Tags</div>
                      <div className="wrap" style={{ gap: 6 }}>
                        {tags.map(t => (
                          <button key={t} onClick={() => toggleDnrTag(t)} aria-pressed={pickedDnrTags.includes(t)} className="pick">
                            {pickedDnrTags.includes(t) && <Check size={12} />}{t}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}
                  {shipList.length > 0 && (
                    <div className="stack" style={{ gap: 6 }}>
                      <div className="t-caps">Ships</div>
                      <div className="wrap" style={{ gap: 6 }}>
                        {shipList.map(sh => (
                          <button key={sh} onClick={() => toggleDnrShip(sh)} aria-pressed={pickedDnrShips.includes(sh)} className="pick">
                            {pickedDnrShips.includes(sh) && <Check size={12} />}{sh}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}
                  <div className="stack" style={{ gap: 6 }}>
                    <div className="t-caps">Category</div>
                    <div><button onClick={() => setPickedDnrCategory(v => !v)} aria-pressed={pickedDnrCategory} className="pick">
                      {pickedDnrCategory && <Check size={12} />}{category}
                    </button></div>
                  </div>
                </div>
              )}
              {pendingDnrCode === DNR_CONTENT && (
                <div className="stack" style={{ gap: 6 }}>
                  <button onClick={confirmDnrContent} disabled={!anyPicked} className="btn btn-primary btn-xl">
                    Confirm {pendingStatus === STATUS_DNF ? 'DNF' : 'Not interested'}
                  </button>
                  {!anyPicked && (
                    <p className="t-caption" style={{ margin: 0, textAlign: 'center' }}>Select at least one item — otherwise pick a different reason above.</p>
                  )}
                </div>
              )}
            </>
          )}

          {panelOnly && pendingStatus !== null
            ? <button onClick={onCancel} className="btn btn-text">Cancel</button>
            : <button onClick={closeSheet} className="btn btn-text">Cancel</button>}
        </Sheet>
      )}
    </div>
  );
}

function RecommendToggle({ ficId, recommended, recSource, onUpdate }) {
  const [picking, setPicking] = useState(false);
  const toggle = () => {
    if (recommended) onUpdate(ficId, { recommended: false, recSource: '' });
    else setPicking(true);
  };
  const pick = (source) => {
    onUpdate(ficId, { recommended: true, recSource: source });
    setPicking(false);
  };
  return (
    <div>
      <button onClick={toggle} className="icon-btn" aria-label={recommended ? 'Remove recommendation mark' : 'Mark as recommended'}
        style={recommended ? { background: 'var(--accent)', color: 'var(--on-accent)' } : { color: 'var(--text-secondary)' }}>
        <Megaphone size={18} color="currentColor" fill={recommended ? 'currentColor' : 'none'} />
      </button>
      {picking && (
        <div className="popover" role="group" aria-label="Where was it recommended?">
          <button onClick={() => pick('Social Media')} className="btn btn-secondary">Social Media</button>
          <button onClick={() => pick('AO3')} className="btn btn-secondary">AO3</button>
        </div>
      )}
    </div>
  );
}

function SyncNote({ fic, onRetry, onDiscard }) {
  if (fic.syncState === 'syncing') return <span className="t-caption">Saving to sheet…</span>;
  if (fic.syncState === 'queued') return <span className="t-caption">Waiting to sync</span>;
  if (fic.syncState === 'error') return (
    <div className="stack">
      <div className="row" style={{ gap: 10, flexWrap: 'wrap' }}>
        <button onClick={() => onRetry(fic.id)} className="link" style={{ color: 'var(--error-text)', padding: 0, textAlign: 'left', textDecoration: 'underline' }}>
          Save failed — tap to retry
        </button>
        {onDiscard && (<button onClick={() => onDiscard(fic.id)} className="link" style={{ color: 'var(--text-secondary)', padding: 0 }}>Discard change</button>)}
      </div>
      {fic.syncError && (<span className="t-caption" style={{ color: 'var(--error-text)' }}>{fic.syncError}</span>)}
    </div>
  );
  return null;
}

function FicCard({ fic, scores, ficIndex, onUpdate, onRetry, onDiscard, onUpdateRecommendation, expanded, onToggleExpand, canAddDateRead, sessionApi }) {
  const { multi } = useContext(FandomCtx);
  const status = scores.status[ficIndex];
  const pScore = scores.pScore[ficIndex];
  const [tagsExpanded, setTagsExpanded] = useState(false);
  const [summaryExpanded, setSummaryExpanded] = useState(false);
  const TAG_PREVIEW = 6;
  const SUMMARY_PREVIEW_LEN = 220;
  const summaryIsLong = fic.summary && fic.summary.length > SUMMARY_PREVIEW_LEN;
  const summaryText = summaryExpanded || !summaryIsLong ? fic.summary : fic.summary.slice(0, SUMMARY_PREVIEW_LEN) + '…';

  const isDnf = status === STATUS_DNF;
  const showTopRow = status !== STATUS_UNREAD || fic.recommended || fic.syncState !== 'idle';

  return (
    <article className={`card stack${isDnf ? ' dnf' : ''}${status === STATUS_NOTINT ? ' notint' : ''}`} style={{ gap: 10 }}>
      {showTopRow && (
        <div className="wrap" style={{ gap: 6, alignItems: 'center' }}>
          <StatusPill status={status} dnr={scores.dnr[ficIndex]} />
          {fic.recommended && (
            <span className="pill" style={{ background: 'var(--inverse)', color: 'var(--on-inverse)' }}>
              <Megaphone size={11} color="currentColor" fill="currentColor" />Recommended{fic.recSource ? ` · ${fic.recSource}` : ''}
            </span>
          )}
          <SyncNote fic={fic} onRetry={onRetry} onDiscard={onDiscard} />
        </div>
      )}

      <div className="row" style={{ alignItems: 'flex-start', justifyContent: 'space-between', gap: 10 }}>
        <div style={{ minWidth: 0 }}>
          <h3 className={`t-card${expanded ? ' big' : ''}`} style={isDnf ? { textDecoration: 'line-through', textDecorationThickness: 2 } : undefined}>{fic.title}</h3>
          {fic.authors.length > 0 && (<div className="t-meta" style={{ marginTop: 2 }}>by {fic.authors.join(', ')}</div>)}
          <div className="t-meta num" style={{ marginTop: 4 }}>
            {fic.rating} · {fic.category} · {fic.words.toLocaleString()} words{fic.chapters > 1 ? ` · ${fic.chapters} ch` : ''} · <span style={{ whiteSpace: 'nowrap' }}>{fic.date}</span>
          </div>
        </div>
        <div className="row" style={{ alignItems: 'flex-start', gap: 6, flexShrink: 0 }}>
          <RecommendToggle ficId={fic.id} recommended={fic.recommended} recSource={fic.recSource} onUpdate={onUpdateRecommendation} />
          <div style={{ textAlign: 'right', minWidth: 44 }}>
            <div className="num" style={{ fontSize: expanded ? 28 : 26, fontWeight: 800, lineHeight: 1, color: 'var(--accent-text)' }}>{pScore.toFixed(0)}</div>
            <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: '0.06em', color: 'var(--text-secondary)', marginTop: 3 }}>SCORE</div>
          </div>
        </div>
      </div>

      <div className="row num" style={{ gap: 16, fontSize: 13, fontWeight: 700, color: 'var(--text-secondary)' }}>
        <span className="row" style={{ gap: 5 }} aria-label={`${fic.kudos.toLocaleString()} kudos`}><Heart />{fic.kudos.toLocaleString()}</span>
        <span className="row" style={{ gap: 5 }} aria-label={`${fic.bookmarks.toLocaleString()} bookmarks`}><BookmarkIcon />{fic.bookmarks.toLocaleString()}</span>
        <span className="row" style={{ gap: 5 }} aria-label={`${fic.hits.toLocaleString()} hits`}><Eye />{fic.hits.toLocaleString()}</span>
      </div>

      {multi && fic.ships.length > 0 && (
        <div className="wrap" style={{ gap: 6 }} aria-label="Ships">
          {fic.ships.map(sh => (<span key={sh} className="tag" style={{ background: 'var(--accent)', color: 'var(--on-accent)', fontWeight: 700 }}>{sh}</span>))}
        </div>
      )}

      {fic.tags.length > 0 && (
        <div className="wrap" style={{ gap: 6, alignItems: 'center' }}>
          {fic.tags.slice(0, tagsExpanded ? fic.tags.length : TAG_PREVIEW).map(t => (
            <span key={t} className="tag">{t}</span>
          ))}
          {fic.tags.length > TAG_PREVIEW && (
            <button onClick={() => setTagsExpanded(v => !v)} className="link">
              {tagsExpanded ? 'Show less' : `+${fic.tags.length - TAG_PREVIEW} more`}
            </button>
          )}
        </div>
      )}

      {fic.summary && (
        <div>
          <p className="t-body" style={{ whiteSpace: 'pre-line' }}>{summaryText}</p>
          {summaryIsLong && (
            <button onClick={() => setSummaryExpanded(v => !v)} className="link" style={{ paddingLeft: 0 }}>
              {summaryExpanded ? 'Show less' : 'Show more'}
            </button>
          )}
        </div>
      )}

      <div className="row" style={{ gap: 8 }}>
        <a href={fic.link} target="_blank" rel="noopener noreferrer" className="btn btn-secondary" style={{ padding: '0 14px' }}>
          AO3 <ExternalLink size={14} />
        </a>
        {(status === STATUS_UNREAD || status === STATUS_TBR || status === STATUS_SKIPPED) && (
          <button onClick={() => onUpdate(fic.id, { status: STATUS_READING, dnr: 0, dnrTags: [], dnrShips: [], dnrCategory: false })} className="btn btn-primary grow">
            Start reading
          </button>
        )}
        {status === STATUS_READ && (
          <button onClick={() => onUpdate(fic.id, { status: STATUS_READING })} className="btn btn-primary grow">
            Read again
          </button>
        )}
        <span className="grow" style={{ flexGrow: (status === STATUS_UNREAD || status === STATUS_TBR || status === STATUS_SKIPPED || status === STATUS_READ) ? 0 : 1 }}></span>
        {(status === STATUS_READING || status === STATUS_PAUSED || (expanded && (status === STATUS_UNREAD || status === STATUS_TBR))) && (
          <SessionButton fic={fic} sessionApi={sessionApi} />
        )}
        <button onClick={() => onToggleExpand(fic.id)} className="icon-btn" aria-label="Toggle status controls" aria-expanded={!!expanded}>
          {expanded ? <ChevronUp size={18} /> : <ChevronDown size={18} />}
        </button>
      </div>

      {expanded && (
        <StatusPicker ficId={fic.id} status={status} dnr={scores.dnr[ficIndex]} dnrTags={fic.dnrTags} dnrShips={fic.dnrShips} dnrCategory={fic.dnrCategory} enjoyment={fic.enjoyment} kg={scores.kg[ficIndex]} bk={scores.bk[ficIndex]} tags={fic.tags} ships={fic.ships} category={fic.category} onUpdate={onUpdate}
          reading={{ dateStarted: fic.dateStarted, dateRead: fic.dateRead, timesRead: fic.timesRead }} canAddDateRead={canAddDateRead}
          title={fic.title} authors={fic.authors} />
      )}
    </article>
  );
}

function ReadingShelfItem({ fic, onUpdate, onStep, onRetry, onDiscard, sessionApi }) {
  const [panel, setPanel] = useState(null); // null | 'finish' | 'dnf'
  const paused = fic.status === STATUS_PAUSED;
  const total = Math.max(1, fic.chapters);
  const pct = Math.min(100, Math.round((fic.chaptersRead / total) * 100));
  const accent = paused ? COLORS.pausedSlate : COLORS.gold;

  return (
    <div id={`shelf-${fic.id}`} className="card stack" style={{ gap: 12, scrollMarginTop: 16, scrollMarginBottom: 170 }}>
      <div className="row" style={{ alignItems: 'flex-start', justifyContent: 'space-between', gap: 8 }}>
        <div style={{ minWidth: 0 }}>
          <h3 className="t-shelf">
            {fic.title}
            {paused && <span className="pill" style={{ marginLeft: 8, verticalAlign: 'middle', background: 'var(--grey-block)', color: 'var(--on-grey)' }}><PauseIcon size={10} />Paused</span>}
          </h3>
          {fic.authors.length > 0 && (<div className="t-meta num" style={{ marginTop: 2 }}>{fic.authors.join(', ')} · {fic.words.toLocaleString()} words</div>)}
        </div>
        <div className="row" style={{ gap: 6, flexShrink: 0 }}>
          <SessionButton fic={fic} sessionApi={sessionApi} />
          <a href={fic.link} target="_blank" rel="noopener noreferrer" className="icon-btn" aria-label="Open on AO3"><ExternalLink size={16} /></a>
        </div>
      </div>

      <div className="row" style={{ gap: 10 }}>
        <div className="track" role="progressbar" aria-label="Chapters read" aria-valuemin={0} aria-valuemax={total} aria-valuenow={fic.chaptersRead}>
          <div style={{ width: `${pct}%`, background: accent }} />
        </div>
        <span className="num" style={{ fontSize: 13, fontWeight: 800 }}>{fic.chaptersRead} / {fic.chapters} ch</span>

function toCSVField(v) {
  const s = String(v ?? '');
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

// ---------- Reading-session timer: hook and UI ----------
function useReadingSession({ fid, fics, updateFic, logMissing, data }) {
  const [active, setActiveState] = useState(() => loadActiveSession(fid));
  const [nowMs, setNowMs] = useState(() => Date.now());
  // ui: null | { kind: 'switch' | 'forgotten' | 'end' | 'flow', pendingFic?, endStamp?, mode?, ficId? }
  const [ui, setUi] = useState(null);
  const ficsRef = useRef(fics);
  useEffect(() => { ficsRef.current = fics; }, [fics]);

  const setActive = (s) => { saveActiveSession(fid, s); setActiveState(s); };
  const freshFic = (fic) => (fic && ficsRef.current.find(f => f.id === fic.id)) || fic;

  useEffect(() => {
    const onStorage = (e) => { // another tab started or ended a session
      if (e.key === fkey(fid, 'reading-session')) setActiveState(loadActiveSession(fid));
    };
    window.addEventListener('storage', onStorage);
    return () => window.removeEventListener('storage', onStorage);
  }, []);

  // A session over 6 hours old, or from an earlier day, is never auto-ended: ask instead.
  const checkForgotten = () => {
    const s = loadActiveSession(fid);
    if (s && isSessionForgotten(s, Date.now())) setUi(u => u || { kind: 'forgotten' });
  };
  useEffect(() => { checkForgotten(); }, []);
  // The tick only re-renders the pill; elapsed time is always worked out from the stored start.
  useEffect(() => {
    if (!active) return;
    const tick = () => setNowMs(Date.now());
    tick();
    const t = setInterval(tick, 15000);
    const onVis = () => { if (document.visibilityState === 'visible') { tick(); checkForgotten(); } };
    document.addEventListener('visibilitychange', onVis);
    return () => { clearInterval(t); document.removeEventListener('visibilitychange', onVis); };
  }, [active]);

  // No Reading Log tab: logging is skipped silently, as for the other events.
  useEffect(() => {
    if (!logMissing) return;
    if (loadActiveSession(fid)) setActive(null);
    setUi(null);
  }, [logMissing]);

  const doStart = async (ficIn) => {
    const fic = freshFic(ficIn);
    if (!fic) return;
    if (fic.status !== STATUS_READING) {
      // The existing Start reading / Resume path (status, Date Started, the Started event).
      const patch = fic.status === STATUS_PAUSED
        ? { status: STATUS_READING }
        : { status: STATUS_READING, dnr: 0, dnrTags: [], dnrShips: [], dnrCategory: false };
      const ok = await updateFic(fic.id, patch);
      if (!ok) return;
    }
    const { session, row } = planSessionStart(fic, Date.now());
    data.addLogRow(row, session.startEventId);
    setActive(session);
  };

  const startSession = (fic) => {
    const cur = loadActiveSession(fid);
    if (cur) {
      const forgotten = isSessionForgotten(cur, Date.now());
      if (cur.ficId === fic.id && !forgotten) { setUi({ kind: 'end' }); return; }
      setUi(forgotten ? { kind: 'forgotten', pendingFic: fic } : { kind: 'switch', pendingFic: fic });
      return;
    }
    doStart(fic);
  };
  const openEnd = () => {
    const cur = loadActiveSession(fid);
    if (!cur) return;
    setUi(isSessionForgotten(cur, Date.now()) ? { kind: 'forgotten' } : { kind: 'end' });
  };

  const writeEnd = (session, chapters, endStamp) => {
    data.addLogRow(sessionEndRow(session, chapters, endStamp));
    setActive(null);
  };
  // Shared by Save / I finished it / DNF. The chapter count goes to the Data List through the same
  // path as the chapter stepper, minus the Progress row (the "Session ended" row records it).
  const endWith = async (mode, chapters) => {
    const s = loadActiveSession(fid);
    const u = ui || {};
    if (!s) { setUi(null); return; }
    if (!u.endStamp && isSessionForgotten(s, Date.now())) { setUi({ kind: 'forgotten', pendingFic: u.pendingFic }); return; }
    const fic = ficsRef.current.find(f => f.id === s.ficId);
    const endChapters = mode === 'finish' ? Math.max(s.startChapters, fic ? fic.chapters || 0 : chapters) : chapters;
    const endStamp = u.endStamp || melbourneNow().stamp;
    setUi(null);
    writeEnd(s, endChapters, endStamp);
    if (fic) await updateFic(fic.id, { chaptersRead: endChapters, lastRead: endStamp }, { skipLogEvents: true });
    if (mode !== 'save' && fic) { setUi({ kind: 'flow', mode, ficId: fic.id, pendingFic: u.pendingFic }); return; }
    if (u.pendingFic) doStart(u.pendingFic);
  };
  const flowDone = () => {
    const p = ui && ui.pendingFic;
    setUi(null);
    if (p) doStart(p);
  };
  const discard = () => {
    const s = loadActiveSession(fid);
    const p = ui && ui.pendingFic;
    if (s) data.removeLogRow(s.startEventId); // a start still waiting to sync is dropped too
    setActive(null);
    setUi(null);
    if (p) doStart(p);
  };
  const setEndTime = (endStamp) => setUi(u => ({ kind: 'end', endStamp, pendingFic: u && u.pendingFic }));

  return {
    enabled: !logMissing, active, nowMs, ui, setUi,
    startSession, openEnd, endWith, flowDone, discard, setEndTime,
  };
}

function TimerIcon(props) {
  return <svg xmlns="http://www.w3.org/2000/svg" width={props.size || 18} height={props.size || 18} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M9.5 2h5"/><path d="M12 2v3"/></svg>;
}

// Timer button on fic cards: starts a session, or opens the end sheet when this fic's session is running.
function SessionButton({ fic, sessionApi }) {
  if (!sessionApi || !sessionApi.enabled) return null;
  const running = !!sessionApi.active && sessionApi.active.ficId === fic.id;
  return (
    <button onClick={() => (running ? sessionApi.openEnd() : sessionApi.startSession(fic))} className="icon-btn"
      aria-label={running ? 'End reading session' : 'Start reading session'} title={running ? 'End session' : 'Start session'}
      style={running ? { background: 'var(--accent)', color: 'var(--on-accent)' } : undefined}>
      <TimerIcon size={18} />
    </button>

}

function SessionPill({ api }) {
  const s = api.active;
  if (!s) return null;
  const forgotten = isSessionForgotten(s, api.nowMs);
  const timeText = forgotten ? `since ${sessionDayLabel(s).split(' ')[0]} ${s.startStamp.slice(11)}` : formatElapsed(api.nowMs - s.startMs);
  const openFic = () => {
    const el = document.getElementById(`shelf-${s.ficId}`) || document.getElementById('reading-shelf');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  };
  return (
    <div className="session-pill" role="region" aria-label="Reading session">
      <button onClick={openFic} className="session-pill-main" aria-label={`${s.title}, ${timeText}. Go to this fic`}>
        <TimerIcon size={18} />
        <span className="session-pill-title">{s.title}</span>
        <span className="session-pill-time num">{timeText}</span>
      </button>
      <button onClick={api.openEnd} className="session-pill-end">End</button>
    </div>
  );
}

function SessionEndSheet({ session, fic, endStamp, pendingFic, onEnd, onDiscard, onClose }) {
  const min = session.startChapters;
  const max = Math.max(min, fic ? fic.chapters || 0 : min);
  const [chapters, setChapters] = useState(() => Math.min(max, Math.max(min, fic ? fic.chaptersRead || 0 : min)));
  const step = (d) => setChapters(c => Math.min(max, Math.max(min, c + d)));
  return (
    <Sheet label="End reading session" onClose={onClose}>
      <div>
        <div className="t-meta" style={{ fontWeight: 700 }}>
          {endStamp ? `Ending at ${endStamp.slice(11)} on ${sessionDayLabel(session)}` : `Reading session · ${formatElapsed(Date.now() - session.startMs)}`}
        </div>
        <h2 className="t-sheet" style={{ marginTop: 2 }}>{session.title}</h2>
        {pendingFic && <p className="t-caption" style={{ margin: '4px 0 0' }}>Then starting {pendingFic.title}</p>}
      </div>
      <div className="stack" style={{ gap: 8 }}>
        <div style={{ fontSize: 15, fontWeight: 800 }}>Chapters read now</div>
        <div className="row" style={{ gap: 8 }}>
          <button onClick={() => step(-1)} disabled={chapters <= min} className="icon-btn" aria-label="One chapter fewer" style={{ fontSize: 20, fontWeight: 700 }}>−</button>
          <div className="num grow" style={{ textAlign: 'center', fontSize: 22, fontWeight: 800 }} aria-live="polite">
            {chapters} <span className="t-meta">/ {fic ? fic.chapters : max} ch</span>
          </div>
          <button onClick={() => step(1)} disabled={chapters >= max} className="icon-btn" aria-label="One chapter more" style={{ fontSize: 20, fontWeight: 700 }}>+</button>
          <button onClick={() => step(1)} disabled={chapters >= max} className="btn btn-secondary">+1 chapter</button>
        </div>
        <p className="t-caption" style={{ margin: 0 }}>
          Started this session at chapter {min}{chapters > min ? ` · +${chapters - min} this session` : ''}
        </p>
      </div>
      <button onClick={() => onEnd('save', chapters)} className="btn btn-primary btn-xl">Save session</button>
      <div className="row" style={{ gap: 8 }}>
        <button onClick={() => onEnd('finish', chapters)} className="btn btn-lg grow" style={{ background: 'var(--lime)', color: '#111111' }}><Check size={14} />I finished it</button>
        <button onClick={() => onEnd('dnf', chapters)} className="btn btn-danger btn-lg grow">DNF</button>
      </div>
      <button onClick={onDiscard} className="btn btn-text">Discard session</button>
    </Sheet>
  );
}

function SessionForgottenSheet({ session, onSetEnd, onDiscard, onClose }) {
  const nowMs = Date.now();
  const bounds = sessionEndBounds(session, nowMs);
  const [picking, setPicking] = useState(false);
  const [time, setTime] = useState(bounds.max);
  const stamp = sessionEndStampFor(session, time, nowMs);
  return (
    <Sheet label="Still reading?" onClose={onClose}>
      <div>
        <h2 className="t-sheet">Still reading {session.title}?</h2>
        <p className="t-body" style={{ marginTop: 6 }}>Your session started at {session.startStamp.slice(11)} on {sessionDayLabel(session)}.</p>
      </div>
      {picking ? (
        <div className="stack" style={{ gap: 8 }}>
          <label className="stack" style={{ gap: 6 }}>
            <span style={{ fontSize: 15, fontWeight: 800 }}>When did you stop reading?</span>
            <input type="time" value={time} min={bounds.min} max={bounds.max} onChange={e => setTime(e.target.value)} aria-describedby="session-end-hint"
              style={{ minHeight: 48, border: 0, borderRadius: 999, padding: '0 16px', background: 'var(--surface-sunken)', color: 'var(--text)', fontSize: 16, fontWeight: 700 }} />
          </label>
          <p id="session-end-hint" className="t-caption" style={{ margin: 0, ...(stamp ? {} : { color: 'var(--error-text)' }) }}>
            Any time from {bounds.min} to {bounds.max} on {sessionDayLabel(session)}.
          </p>
          <button disabled={!stamp} onClick={() => onSetEnd(stamp)} className="btn btn-primary btn-xl">Next: chapters read</button>
        </div>
      ) : (
        <button onClick={() => setPicking(true)} className="btn btn-primary btn-xl">Set end time</button>
      )}
      <button onClick={onDiscard} className="btn btn-text">Discard</button>
    </Sheet>
  );
}

// Everything the session shows on top of the app: the floating pill and its sheets.
function SessionLayer({ api, fics, onUpdate }) {
  const s = api.active;
  const ui = api.ui;
  const sessionFic = s ? fics.find(f => f.id === s.ficId) : null;
  const flowFic = ui && ui.kind === 'flow' ? fics.find(f => f.id === ui.ficId) : null;
  return (
    <>
      <SessionPill api={api} />
      {ui && ui.kind === 'switch' && s && (
        <Sheet label="End current session?" onClose={() => api.setUi(null)}>
          <h2 className="t-sheet">End your session on {s.title} first?</h2>
          <button onClick={() => api.setUi({ kind: 'end', pendingFic: ui.pendingFic })} className="btn btn-primary btn-xl">End it and start this one</button>
          <button onClick={() => api.setUi(null)} className="btn btn-text">Cancel</button>
        </Sheet>
      )}
      {ui && ui.kind === 'forgotten' && s && (
        <SessionForgottenSheet key={`forgot-${s.startEventId}`} session={s} onSetEnd={api.setEndTime} onDiscard={api.discard} onClose={() => api.setUi(null)} />
      )}
      {ui && ui.kind === 'end' && s && (
        <SessionEndSheet key={`end-${s.startEventId}-${ui.endStamp || ''}`} session={s} fic={sessionFic} endStamp={ui.endStamp} pendingFic={ui.pendingFic}
          onEnd={api.endWith} onDiscard={api.discard} onClose={() => api.setUi(null)} />
      )}
      {flowFic && (
        <StatusPicker key={`flow-${ui.ficId}-${ui.mode}`} ficId={flowFic.id} status={flowFic.status} dnr={flowFic.dnr} dnrTags={flowFic.dnrTags} dnrShips={flowFic.dnrShips} ships={flowFic.ships} dnrCategory={flowFic.dnrCategory} enjoyment={flowFic.enjoyment}
          kg={flowFic.kg} bk={flowFic.bk} tags={flowFic.tags} category={flowFic.category} onUpdate={onUpdate}
          panelOnly initialPending={ui.mode === 'finish' ? STATUS_READ : STATUS_DNF}
          onDone={api.flowDone} onCancel={api.flowDone} title={flowFic.title} authors={flowFic.authors} />
      )}
    </>
  );
}

function ExportPanel({ fandom, fics, onClose }) {
  const csvText = [
    'Title,Link,Status,DNR Reason,K,B',
    ...fics.map(f => [f.title, f.link, f.status ? STATUS_LABELS[f.status] : '', f.dnr ? DNR_LABELS[f.dnr] : '', f.kg ? 'Y' : '', f.bk ? 'Y' : ''].map(toCSVField).join(','))
  ].join('\n');

  const [copied, setCopied] = useState(false);
  const copyToClipboard = async () => {
    try { await navigator.clipboard.writeText(csvText); setCopied(true); setTimeout(() => setCopied(false), 2000); }
    catch (e) { /* ignore */ }
  };
  const downloadCSV = () => {
    const blob = new Blob([csvText], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${fandom.id}-backup.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  return (
    <Sheet label="Backup current list" onClose={onClose}>
      <div className="row" style={{ justifyContent: 'space-between', gap: 8 }}>
        <h2 className="t-sheet">Backup current list</h2>
        <button onClick={onClose} className="icon-btn" aria-label="Close"><X size={18} /></button>
      </div>
      <p className="t-body">
        Since marks now write straight to your sheet, this is just a snapshot backup of everything as it currently stands — not something you need day-to-day.
      </p>
      <div className="row" style={{ gap: 8 }}>
        <button onClick={copyToClipboard} className="btn btn-primary btn-lg grow">
          {copied ? 'Copied!' : 'Copy to clipboard'}
        </button>
        <button onClick={downloadCSV} className="btn btn-secondary btn-lg">
          <Download size={16} /> CSV
        </button>
      </div>
    </Sheet>
  );
}

function FandomSwitcherSheet({ currentId, currentReading, accessToken, onPick, onClose }) {
  const [counts, setCounts] = useState(() => {
    const c = {};
    FANDOMS.forEach(f => { const s = fandomSummary(f.id); if (s && typeof s.reading === 'number') c[f.id] = s.reading; });
    c[currentId] = currentReading;
    return c;
  });
  // With a token, refresh the other fandoms' counts from their Status column (small reads).
  useEffect(() => {
    if (!accessToken) return;
    let alive = true;
    FANDOMS.forEach(f => {
      if (f.id === currentId || outboxLoad(f.id).length) return; // local changes waiting: keep the local count
      sheetsApiGetStatusColumn(accessToken, f.sheetId).then(statuses => {
        const n = statuses.filter(s => s === 'Currently Reading' || s === 'Paused').length;
        lsSet(fkey(f.id, 'summary'), { reading: n, at: Date.now() });
        if (alive) setCounts(c => ({ ...c, [f.id]: n }));
      }).catch(() => {});
    });
    return () => { alive = false; };
  }, []);
  return (
    <Sheet label="Switch fandom" onClose={onClose}>
      <div className="row" style={{ justifyContent: 'space-between' }}>
        <h2 className="t-sheet">Fandoms</h2>
        <button onClick={onClose} className="icon-btn" aria-label="Close"><X size={18} /></button>
      </div>
      <FandomList currentId={currentId} counts={counts} onPick={onPick} />
    </Sheet>
  );
}

// ---------- One fandom's screen (remounted fresh for each fandom) ----------
function FandomApp({ fandom, auth, onSwitch }) {
  const fid = fandom.id;
  const multi = isMulti(fandom);
  const { accessToken, gisReady, signIn, signOut, authError, renewing } = auth;
  const data = useSheetFics(fandom, auth);
  const { fics, status: syncStatus, errorMsg, lastSynced, cacheState, refresh, updateFic, retrySync, discardFailed, updateRecommendation, stepChapters, readingMissing, logMissing, queueCount } = data;
  const scores = useComputedScores(fics, multi);
  const sessionApi = useReadingSession({ fid, fics, updateFic, logMissing, data });

  // Remembered per fandom: filters, sort, open section, open card, shelf, list length, scroll position.
  const saved = useRef(lsGet(fkey(fid, 'ui'), null) || {}).current;
  const [search, setSearch] = useState(saved.search ?? '');
  const [statusFilter, setStatusFilter] = useState(() => new Set(Array.isArray(saved.status) ? saved.status : [STATUS_UNREAD]));
  const [ratingFilter, setRatingFilter] = useState(() => new Set(saved.rating || []));
  const [wordFilter, setWordFilter] = useState(() => new Set(saved.words || []));
  const [selectedTags, setSelectedTags] = useState(saved.includeTags || []);
  const [tagQuery, setTagQuery] = useState('');
  const [excludedTags, setExcludedTags] = useState(saved.excludeTags || []);
  const [excludeTagQuery, setExcludeTagQuery] = useState('');
  const [recommendedOnly, setRecommendedOnly] = useState(!!saved.recommendedOnly);
  const [filtersOpen, setFiltersOpen] = useState(false);
  const [sortBy, setSortBy] = useState(saved.sortBy || 'score');
  const [expandedId, setExpandedId] = useState(saved.expandedId ?? null);
  const [visibleCount, setVisibleCount] = useState(saved.visibleCount || PAGE_SIZE);
  const [showSettings, setShowSettings] = useState(false);
  const [showExport, setShowExport] = useState(false);
  const [showSwitcher, setShowSwitcher] = useState(false);
  const [shelfOpen, setShelfOpen] = useState(saved.shelfOpen ?? true);
  const [navSection, setNavSection] = useState(saved.navSection || 'fics');
  const [barDismissed, setBarDismissed] = useState(false);
  const [theme, setTheme] = useState(() => lsGetRaw(KEYS.theme) || 'auto');

  const scrollYRef = useRef(saved.scrollY || 0);
  const restoredRef = useRef(false);
  const uiRef = useRef({});
  uiRef.current = {
    search, status: [...statusFilter], rating: [...ratingFilter], words: [...wordFilter], includeTags: selectedTags, excludeTags: excludedTags,
    recommendedOnly, sortBy, expandedId, visibleCount, shelfOpen, navSection,
  };
  const saveUi = useCallback(() => {
    if (restoredRef.current) scrollYRef.current = window.scrollY;
    lsSet(fkey(fid, 'ui'), { ...uiRef.current, scrollY: scrollYRef.current });
  }, [fid]);
  useEffect(() => { const t = setTimeout(saveUi, 250); return () => clearTimeout(t); },
    [search, statusFilter, ratingFilter, wordFilter, selectedTags, excludedTags, recommendedOnly, sortBy, expandedId, visibleCount, shelfOpen, navSection]);
  useEffect(() => {
    let t = null;
    const onScroll = () => { if (!restoredRef.current) return; clearTimeout(t); t = setTimeout(saveUi, 200); };
    const onHide = () => { if (document.visibilityState === 'hidden') saveUi(); };
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('pagehide', saveUi);
    document.addEventListener('visibilitychange', onHide);
    return () => { clearTimeout(t); window.removeEventListener('scroll', onScroll); window.removeEventListener('pagehide', saveUi); document.removeEventListener('visibilitychange', onHide); };
  }, [saveUi]);
  // Back to where you were, once the list is on screen.
  useEffect(() => {
    if (restoredRef.current || !scores || !fics.length) return;
    const y = scrollYRef.current;
    requestAnimationFrame(() => {
      window.scrollTo(0, y);
      requestAnimationFrame(() => { window.scrollTo(0, y); restoredRef.current = true; });
    });
  }, [scores, fics.length]);
  const switchTo = (id) => { saveUi(); setShowSwitcher(false); if (id !== fid) onSwitch(id); };

  const ALL_RATINGS = useMemo(() => [...new Set(fics.map(f => f.rating).filter(Boolean))].sort(), [fics]);
  const ALL_TAGS = useMemo(() => [...new Set(fics.flatMap(f => f.tags))], [fics]);
  const TAG_FREQUENCY = useMemo(() => {
    const m = new Map();
    fics.forEach(f => f.tags.forEach(t => m.set(t, (m.get(t) || 0) + 1)));
    return m;
  }, [fics]);
  const TAGS_BY_FREQUENCY = useMemo(() => [...ALL_TAGS].sort((a, b) => TAG_FREQUENCY.get(b) - TAG_FREQUENCY.get(a)), [ALL_TAGS, TAG_FREQUENCY]);

  const tagSuggestions = useMemo(() => {
    const q = tagQuery.trim().toLowerCase();
    const pool = q ? [...ALL_TAGS].sort() : TAGS_BY_FREQUENCY;
    return pool
      .filter(t => !selectedTags.includes(t) && !excludedTags.includes(t))
      .filter(t => !q || t.toLowerCase().includes(q))
      .slice(0, 5);
  }, [ALL_TAGS, TAGS_BY_FREQUENCY, tagQuery, selectedTags, excludedTags]);
  const addTag = (t) => { setSelectedTags(prev => [...prev, t]); setTagQuery(''); };
  const removeTag = (t) => setSelectedTags(prev => prev.filter(x => x !== t));

  const excludeTagSuggestions = useMemo(() => {
    const q = excludeTagQuery.trim().toLowerCase();
    const pool = q ? [...ALL_TAGS].sort() : TAGS_BY_FREQUENCY;
    return pool
      .filter(t => !selectedTags.includes(t) && !excludedTags.includes(t))
      .filter(t => !q || t.toLowerCase().includes(q))
      .slice(0, 5);
  }, [ALL_TAGS, TAGS_BY_FREQUENCY, excludeTagQuery, selectedTags, excludedTags]);
  const addExcludeTag = (t) => { setExcludedTags(prev => [...prev, t]); setExcludeTagQuery(''); };
  const removeExcludeTag = (t) => setExcludedTags(prev => prev.filter(x => x !== t));

  const toggleSetValue = (setFn, set, val) => {
    setFn(prev => { const next = new Set(prev); if (next.has(val)) next.delete(val); else next.add(val); return next; });
  };

  const filteredIndices = useMemo(() => {
    if (!scores) return [];
    const q = search.trim().toLowerCase();
    const indices = [];
    for (let i = 0; i < fics.length; i++) {
      const f = fics[i];
      if (statusFilter.size && !statusFilter.has(scores.status[i])) continue;
      if (ratingFilter.size && !ratingFilter.has(f.rating)) continue;
      if (wordFilter.size) {
        const inRange = [...wordFilter].some(bIdx => { const [, min, max] = WORD_BUCKETS[bIdx]; return f.words >= min && f.words < max; });
        if (!inRange) continue;
      }
      if (selectedTags.length && !selectedTags.every(t => f.tags.includes(t))) continue;
      if (excludedTags.length && excludedTags.some(t => f.tags.includes(t))) continue;
      if (recommendedOnly && !f.recommended) continue;
      if (q) {
        const titleMatch = f.title.toLowerCase().includes(q);
        const tagMatch = f.tags.some(t => t.toLowerCase().includes(q));
        const shipMatch = multi && f.ships.some(s => s.toLowerCase().includes(q));
        const authorMatch = f.authors.some(a => a.toLowerCase().includes(q));
        if (!titleMatch && !tagMatch && !shipMatch && !authorMatch) continue;
      }
      indices.push(i);
    }
    if (sortBy === 'score') indices.sort((a, b) => scores.pScore[b] - scores.pScore[a]);
    else if (sortBy === 'qscore') indices.sort((a, b) => scores.qScore[b] - scores.qScore[a]);
    else if (sortBy === 'recent') indices.sort((a, b) => parseFicDate(fics[b].date) - parseFicDate(fics[a].date));
    else if (sortBy === 'kudos') indices.sort((a, b) => fics[b].kudos - fics[a].kudos);
    return indices;
  }, [fics, scores, search, statusFilter, ratingFilter, wordFilter, selectedTags, excludedTags, recommendedOnly, sortBy, multi]);

  // Changing a filter starts the list from the top again (but not when restoring saved settings).
  const firstFilterRun = useRef(true);
  useEffect(() => {
    if (firstFilterRun.current) { firstFilterRun.current = false; return; }
    setVisibleCount(PAGE_SIZE);
  }, [search, statusFilter, ratingFilter, wordFilter, sortBy]);

  // UI glue for the floating nav (layout only; no data or logic involved).
  const goTo = (section) => {
    setNavSection(section);
    if (section === 'fics') window.scrollTo({ top: 0, behavior: 'smooth' });
    if (section === 'reading') { const el = document.getElementById('reading-shelf'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  };
  const activeNav = filtersOpen ? 'filters' : showSettings ? 'account' : navSection;
  const SORT_NOTE = { score: 'by score', qscore: 'by popularity', recent: 'newest first', kudos: 'by kudos' };
  const chooseTheme = (t) => { setTheme(t); lsSetRaw(KEYS.theme, t === 'auto' ? null : t); window.applyTheme(t); };

  const hasData = fics.length > 0 || cacheState === 'hit';
  if (!accessToken && !renewing && cacheState === 'miss' && !fics.length) {
    return (
      <>
        <SignInScreen fandom={fandom} onSignIn={signIn} gisReady={gisReady} authError={authError} onSwitch={() => setShowSwitcher(true)} />
        {showSwitcher && <FandomSwitcherSheet currentId={fid} currentReading={0} accessToken={null} onPick={switchTo} onClose={() => setShowSwitcher(false)} />}
      </>
    );
  }

  const activeFilterCount = ratingFilter.size + wordFilter.size + selectedTags.length + excludedTags.length;
  const failedSyncCount = fics.filter(f => f.syncState === 'error').length;
  const syncingCount = fics.filter(f => f.syncState === 'syncing').length;
  const readingCount = fics.filter(f => isShelfStatus(f.status)).length;
  const visible = filteredIndices.slice(0, visibleCount);
  const timeText = lastSynced ? lastSynced.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

  return (
    <div className={`app stack${sessionApi.active ? ' has-session' : ''}`} style={{ gap: 18 }}>
      <header className="stack" style={{ gap: 12 }}>
        <div className="row" style={{ justifyContent: 'space-between', gap: 12 }}>
          <h1 style={{ margin: 0, minWidth: 0 }}>
            <button className="fandom-switch" onClick={() => setShowSwitcher(true)} aria-label={`${fandom.title}, ${fandomLine(fandom)}. Switch fandom`}>
              <span className="t-fandom">{fandomLine(fandom)}</span>
              <span className="t-app"><span className="hl">{fandom.title}</span><ChevronDown size={22} /></span>
            </button>
          </h1>
          <button onClick={accessToken ? refresh : signIn} disabled={syncStatus === 'loading'} className="icon-btn raised" aria-label={accessToken ? 'Refresh from sheet' : 'Sign in to sync'}>
            <span style={{ display: 'inline-flex', animation: syncStatus === 'loading' ? 'spin 1s linear infinite' : 'none' }}><RefreshCw size={18} /></span>
          </button>
        </div>

        <div className="row" style={{ gap: 8, flexWrap: 'wrap' }}>
          <span className="count-pill num">{filteredIndices.length.toLocaleString()} of {fics.length.toLocaleString()}</span>
          <span className="t-meta">
            {syncStatus === 'loading' && 'Syncing…'}
            {syncStatus !== 'loading' && syncStatus !== 'error' && lastSynced && (accessToken ? `Synced ${timeText}` : `Saved copy from ${timeText}`)}
            {syncStatus === 'error' && <span style={{ color: 'var(--error-text)' }}>Sync failed — showing last loaded data</span>}
            {queueCount > 0 && ` · ${queueCount} change${queueCount === 1 ? '' : 's'} waiting to sync`}
          </span>
        </div>

        {!accessToken && hasData && !barDismissed && (
          <div className="signin-bar" role="status">
            <span className="grow">{renewing ? 'Reconnecting to Google…' : 'Sign in to sync'}</span>
            {!renewing && <button onClick={signIn} disabled={!gisReady} className="btn">Sign in</button>}
            <button onClick={() => setBarDismissed(true)} className="icon-btn" aria-label="Dismiss"><X size={16} /></button>
          </div>
        )}
        {authError && !accessToken && (<div className="banner error" role="alert">{authError}</div>)}
        {syncStatus === 'error' && (<div className="banner error" role="alert">{errorMsg}</div>)}
        {failedSyncCount > 0 && (
          <div className="banner error" role="alert" style={{ fontWeight: 700 }}>
            {failedSyncCount} fic{failedSyncCount === 1 ? '' : 's'} failed to save to your sheet — scroll down to find the red "tap to retry" note on each.
          </div>
        )}
        {(readingMissing.length > 0 || logMissing) && (
          <div className="banner warn">
            Reading tracker isn't fully set up, so some things aren't being saved:
            {readingMissing.length > 0 && <> no column named {readingMissing.map(c => `"${c}"`).join(', ')}.</>}
            {logMissing && <> no tab named "Reading Log".</>}
            {' '}Names must match exactly, including capitalisation and spacing.
          </div>
        )}
        {syncingCount > 0 && failedSyncCount === 0 && (
          <div className="banner info">
            Saving {syncingCount} change{syncingCount === 1 ? '' : 's'} to your sheet…
          </div>
        )}

        <label className="search">
          <Search size={18} />
          <input value={search} onChange={e => setSearch(e.target.value)} placeholder={multi ? 'Search title, tag, ship or author' : 'Search title, tag or author'} aria-label="Search fics" />
          {search && (<button onClick={() => setSearch('')} className="icon-btn" style={{ background: 'transparent' }} aria-label="Clear search"><X size={16} /></button>)}
        </label>

        <div className="hscroll" role="group" aria-label="Status filters">
          <button onClick={() => setFiltersOpen(v => !v)} className="chip" aria-expanded={filtersOpen}
            style={{ background: 'var(--inverse)', color: 'var(--on-inverse)', fontWeight: 700, boxShadow: 'none' }}>
            <SlidersHorizontal size={16} /> Filters {activeFilterCount > 0 ? `(${activeFilterCount})` : ''}
          </button>
          {[STATUS_UNREAD, STATUS_TBR, STATUS_READING, STATUS_PAUSED, STATUS_READ, STATUS_DNF, STATUS_SKIPPED, STATUS_NOTINT].map(s => (
            <Chip key={s} active={statusFilter.has(s)} onClick={() => toggleSetValue(setStatusFilter, statusFilter, s)} color={STATUS_COLOR[s]} textColor={STATUS_ON[s]}>{STATUS_LABELS[s]}</Chip>
          ))}
          <Chip active={recommendedOnly} onClick={() => setRecommendedOnly(v => !v)}>Recommended</Chip>
        </div>

        <div className="seg" role="group" aria-label="Sort by">
          {[['score', 'Score'], ['qscore', 'Popularity'], ['recent', 'Newest'], ['kudos', 'Kudos']].map(([key, label]) => (
            <button key={key} onClick={() => setSortBy(key)} aria-pressed={sortBy === key}>{label}</button>
          ))}
        </div>
      </header>

      <CurrentlyReadingShelf fics={fics} onUpdate={updateFic} onStep={stepChapters} onRetry={retrySync} onDiscard={discardFailed} missingCols={readingMissing} sessionApi={sessionApi}
        open={shelfOpen} setOpen={setShelfOpen} />

      <main id="fic-list" className="stack" style={{ gap: 12 }}>
        <h2 className="t-section">Fics <span className="t-meta">· {SORT_NOTE[sortBy]}</span></h2>
        {(syncStatus === 'loading' || cacheState === 'loading' || renewing) && fics.length === 0 && (
          <div className="card row" style={{ gap: 10, justifyContent: 'center', color: 'var(--text-secondary)' }}>
            <span style={{ display: 'inline-flex', color: 'var(--accent-text)', animation: 'spin 1s linear infinite' }}><RefreshCw size={18} /></span>
            <span className="t-meta">Loading your fic list…</span>
          </div>
        )}
        {visible.length === 0 && syncStatus !== 'loading' && cacheState !== 'loading' && !(renewing && !fics.length) && (
          <div className="card" style={{ textAlign: 'center' }}><span className="t-meta">No fics match these filters.</span></div>
        )}
        {scores && visible.map(idx => (
          <FicCard key={fics[idx].id} fic={fics[idx]} ficIndex={idx} scores={scores} onUpdate={updateFic} onRetry={retrySync} onDiscard={discardFailed} onUpdateRecommendation={updateRecommendation} canAddDateRead={!readingMissing.includes('Date Read')} sessionApi={sessionApi}
            expanded={expandedId === fics[idx].id} onToggleExpand={(id) => setExpandedId(prev => (prev === id ? null : id))} />
        ))}
        {visibleCount < filteredIndices.length && (
          <button onClick={() => setVisibleCount(v => v + PAGE_SIZE)} className="btn btn-secondary btn-lg" style={{ width: '100%', background: 'var(--surface)', boxShadow: 'var(--shadow-control)' }}>
            Load more ({filteredIndices.length - visibleCount} remaining)
          </button>
        )}
      </main>

      {filtersOpen && (
        <Sheet label="Filters" onClose={() => setFiltersOpen(false)}>
          <div className="row" style={{ justifyContent: 'space-between' }}>
            <h2 className="t-sheet">Filters</h2>
            <button onClick={() => setFiltersOpen(false)} className="icon-btn" aria-label="Close filters"><X size={18} /></button>
          </div>
          <div className="stack" style={{ gap: 8 }}>
            <div className="t-caps">Rating</div>
            <div className="wrap" style={{ gap: 8 }}>{ALL_RATINGS.map(r => (<Chip key={r} active={ratingFilter.has(r)} onClick={() => toggleSetValue(setRatingFilter, ratingFilter, r)}>{r}</Chip>))}</div>
          </div>
          <div className="stack" style={{ gap: 8 }}>
            <div className="t-caps">Word count</div>
            <div className="wrap" style={{ gap: 8 }}>{WORD_BUCKETS.map(([label], i) => (<Chip key={label} active={wordFilter.has(i)} onClick={() => toggleSetValue(setWordFilter, wordFilter, i)}>{label}</Chip>))}</div>
          </div>
          <div className="stack" style={{ gap: 8 }}>
            <div className="t-caps">Include tags</div>
            {selectedTags.length > 0 && (
              <div className="wrap" style={{ gap: 6 }}>
                {selectedTags.map(t => (
                  <span key={t} className="pill" style={{ background: 'var(--accent)', color: 'var(--on-accent)', fontSize: 13, fontWeight: 700, padding: '0 0 0 14px', minHeight: 44 }}>
                    {t}
                    <button onClick={() => removeTag(t)} aria-label={`Remove ${t} filter`} className="row" style={{ width: 44, height: 44, justifyContent: 'center' }}><X size={14} /></button>
                  </span>
                ))}
              </div>
            )}
            <label className="search sunken">
              <Search size={16} />
              <input value={tagQuery} onChange={e => setTagQuery(e.target.value)} placeholder={tagQuery ? 'Search tags…' : 'Top 5 shown — or search…'} aria-label="Search tags to include" />
            </label>
            {tagSuggestions.length > 0 && (
              <div className="wrap" style={{ gap: 6 }}>
                {tagSuggestions.map(t => (
                  <button key={t} onClick={() => addTag(t)} className="pick" style={{ background: 'var(--surface-sunken)' }}>
                    {t} <span className="t-meta">({TAG_FREQUENCY.get(t)})</span>
                  </button>
                ))}
              </div>
            )}
          </div>
          <div className="stack" style={{ gap: 8 }}>
            <div className="t-caps">Exclude tags</div>
            {excludedTags.length > 0 && (
              <div className="wrap" style={{ gap: 6 }}>
                {excludedTags.map(t => (
                  <span key={t} className="pill" style={{ background: 'var(--inverse)', color: 'var(--on-inverse)', fontSize: 13, fontWeight: 700, padding: '0 0 0 14px', minHeight: 44 }}>
                    <span style={{ textDecoration: 'line-through' }}>{t}</span>
                    <button onClick={() => removeExcludeTag(t)} aria-label={`Remove ${t} exclusion`} className="row" style={{ width: 44, height: 44, justifyContent: 'center' }}><X size={14} /></button>
                  </span>
                ))}
              </div>
            )}
            <label className="search sunken">
              <Search size={16} />
              <input value={excludeTagQuery} onChange={e => setExcludeTagQuery(e.target.value)} placeholder={excludeTagQuery ? 'Search tags…' : 'Top 5 shown — or search…'} aria-label="Search tags to exclude" />
            </label>
            {excludeTagSuggestions.length > 0 && (
              <div className="wrap" style={{ gap: 6 }}>
                {excludeTagSuggestions.map(t => (
                  <button key={t} onClick={() => addExcludeTag(t)} className="pick" style={{ background: 'var(--surface-sunken)' }}>
                    {t} <span className="t-meta">({TAG_FREQUENCY.get(t)})</span>
                  </button>
                ))}
              </div>
            )}
          </div>
          <button onClick={() => setFiltersOpen(false)} className="btn btn-primary btn-xl">Show {filteredIndices.length.toLocaleString()} fics</button>
        </Sheet>
      )}

      {showSettings && (
        <Sheet label="Account" onClose={() => setShowSettings(false)}>
          <div className="row" style={{ justifyContent: 'space-between' }}>
            <h2 className="t-sheet">Account</h2>
            <button onClick={() => setShowSettings(false)} className="icon-btn" aria-label="Close account"><X size={18} /></button>
          </div>
          <p className="t-body">{accessToken ? `Signed in and syncing to your ${fandom.title} sheet.` : `Not signed in. Changes are saved on this device and written to your ${fandom.title} sheet when you sign in.`}</p>
          {!accessToken && <button onClick={() => { setShowSettings(false); signIn(); }} className="btn btn-primary btn-lg">Sign in with Google</button>}
          <div className="stack" style={{ gap: 8 }}>
            <div className="t-caps">Appearance · all fandoms</div>
            <div className="seg" role="group" aria-label="Appearance">
              {THEME_OPTIONS.map(([key, label]) => (<button key={key} onClick={() => chooseTheme(key)} aria-pressed={theme === key}>{label}</button>))}
            </div>
          </div>
          <button onClick={() => { setShowSettings(false); setShowExport(true); }} className="btn btn-secondary btn-lg"><Download size={16} /> Backup list</button>
          {accessToken && <button onClick={signOut} className="btn btn-text" style={{ color: 'var(--error-text)' }}>Sign out</button>}
        </Sheet>
      )}

      {showExport && <ExportPanel fandom={fandom} fics={fics} onClose={() => setShowExport(false)} />}
      {showSwitcher && <FandomSwitcherSheet currentId={fid} currentReading={readingCount} accessToken={accessToken} onPick={switchTo} onClose={() => setShowSwitcher(false)} />}

      <SessionLayer api={sessionApi} fics={fics} onUpdate={updateFic} />

      <nav className="nav" aria-label="Sections">
        <button onClick={() => goTo('fics')} aria-current={activeNav === 'fics' ? 'page' : undefined} aria-label="Fics"><ListIcon />{activeNav === 'fics' && 'Fics'}</button>
        <button onClick={() => goTo('reading')} aria-current={activeNav === 'reading' ? 'page' : undefined} aria-label="Reading"><BookIcon />{activeNav === 'reading' && 'Reading'}</button>
        <button onClick={() => setFiltersOpen(true)} aria-current={activeNav === 'filters' ? 'page' : undefined} aria-label="Filters"><SlidersHorizontal size={20} />{activeNav === 'filters' && 'Filters'}</button>
        <button onClick={() => setShowSettings(true)} aria-current={activeNav === 'account' ? 'page' : undefined} aria-label="Account"><UserIcon />{activeNav === 'account' && 'Account'}</button>
      </nav>
    </div>
  );
}

// ---------- The app: one sign-in, one fandom on screen at a time ----------
function FicsApp() {
  const auth = useGoogleAuth();
  const [fid, setFid] = useState(window.FICS_INITIAL_FANDOM);
  const fandom = FANDOM_BY_ID[fid] || null;
  const switchTo = useCallback((id) => {
    const f = FANDOM_BY_ID[id];
    if (!f) return;
    lsSetRaw(KEYS.lastFandom, id);
    try { history.replaceState(null, '', `${location.pathname}?fandom=${encodeURIComponent(id)}${location.hash}`); } catch (e) {}
    window.applyFandomChrome(f);
    window.scrollTo(0, 0);
    setFid(id);
  }, []);
  const ctx = useMemo(() => ({ fandom, multi: isMulti(fandom) }), [fandom]);
  if (!fandom) return <FandomPicker onPick={switchTo} />;
  return (
    <FandomCtx.Provider value={ctx}>
      <FandomApp key={fandom.id} fandom={fandom} auth={auth} onSwitch={switchTo} />
    </FandomCtx.Provider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<FicsApp />);
</script>
</body>
</html>
